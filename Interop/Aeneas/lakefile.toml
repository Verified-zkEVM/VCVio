name = "VCVioInteropAeneas"
defaultTargets = ["InteropAeneas"]

# The Aeneas sub-project of `Interop/`: Rust code extracted by hax and Aeneas, lifted into VCVio.
# VCVio's dependents must never resolve these requires, so they live in this package and not in the
# root lakefile. Sources are read from the repository root, so modules keep their `Interop.Aeneas.`
# names; the pins equal the root's (Lean v4.36.0, Mathlib v4.36.0), so the root's dependency cache
# is shared. See README.md.
srcDir = "../.."
packagesDir = "../../.lake/packages"

# The root package's options, so the bridges meet the same style.
[leanOptions]
pp.unicode.fun = true
pp.proofs.withType = false
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.redundantVisibility = true
weak.linter.style.longFile = 1500
experimental.vcgen = true
weak.linter.unicodeLinter = false
weak.linter.constructorNameAsVariable = false

[[require]]
name = "VCVio"
path = "../.."

# hax and Aeneas emit code in the same monad, `Aeneas.Std.RustM`.
[[require]]
name = "hax"
git = { url = "https://github.com/cryspen/hax", subDir = "hax-lib/proof-libs/lean" }
rev = "a045d15a3bf43fe05096146f488668b521a4ae44"

# The hax-compatible RustM backend with Aeneas's Lean 4.36 port.
[[require]]
name = "aeneas"
git = { url = "https://github.com/dtumad/aeneas", subDir = "backends/lean" }
rev = "1e414a5475e05de76bede89be7849d3cf71afaf6"

# Declared last so the root's Mathlib pin stays authoritative.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

# The lift, the interaction-tree bridges and the proofs about the hax examples. As the default
# target, its roots are the roots of the sub-project's axiom sweep in CI.
[[lean_lib]]
name = "InteropAeneas"
roots = [
  "Interop.Aeneas.ITree", "Interop.Aeneas.WP",
  "Interop.Aeneas.Lift.Common", "Interop.Aeneas.Lift.Run", "Interop.Aeneas.Lift.RustM",
  "Interop.Aeneas.Lift.Triple",
  "Interop.Aeneas.Hax.Holds", "Interop.Aeneas.Hax.Adc.Verification",
  "Interop.Aeneas.Hax.Barrett.Verification", "Interop.Aeneas.Hax.CenteredBinomial.Verification",
  "Interop.Aeneas.Hax.Computation.Verification", "Interop.Aeneas.Hax.Division.Verification",
  "Interop.Aeneas.Hax.Examples.Verification",
]

# The modules hax extracts from the example crates in `Interop/Aeneas/Hax/<Name>/`, generated by
# `scripts/regenerate-hax.sh` and committed. aeneas writes no module docstring, so the header linter
# is off for them; the proofs about them are in `InteropAeneas`.
[[lean_lib]]
name = "InteropAeneasHaxExtraction"
globs = [
  "Interop.Aeneas.Hax.Adc.Extraction.+", "Interop.Aeneas.Hax.Barrett.Extraction.+",
  "Interop.Aeneas.Hax.CenteredBinomial.Extraction.+",
  "Interop.Aeneas.Hax.Computation.Extraction.+", "Interop.Aeneas.Hax.Division.Extraction.+",
  "Interop.Aeneas.Hax.Examples.Extraction.+",
]
leanOptions = { weak.linter.style.header = false }
