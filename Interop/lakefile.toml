name = "VCVioInterop"
defaultTargets = ["InteropRust"]

# Bridges from external verification tools whose Lean libraries VCVio's dependents must never
# resolve: every dependent resolves every `require` in VCVio's root lakefile, so these requires live
# here. See README.md. Sources stay at the repository root, so modules keep their `Interop.` names;
# the pins equal the root's (Lean v4.36.0, Mathlib v4.36.0), so the root's dependency cache is
# shared.
srcDir = ".."
packagesDir = "../.lake/packages"

# The root package's options, so the bridges meet the same style.
[leanOptions]
pp.unicode.fun = true
pp.proofs.withType = false
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.redundantVisibility = true
weak.linter.style.longFile = 1500
experimental.vcgen = true
weak.linter.unicodeLinter = false
weak.linter.constructorNameAsVariable = false

[[require]]
name = "VCVio"
path = ".."

# hax and Aeneas emit code in the same monad, `Aeneas.Std.RustM`.
[[require]]
name = "hax"
git = { url = "https://github.com/cryspen/hax", subDir = "hax-lib/proof-libs/lean" }
rev = "a045d15a3bf43fe05096146f488668b521a4ae44"

# The hax-compatible RustM backend with Aeneas's Lean 4.36 port.
[[require]]
name = "aeneas"
git = { url = "https://github.com/dtumad/aeneas", subDir = "backends/lean" }
rev = "1e414a5475e05de76bede89be7849d3cf71afaf6"

# Declared last so the root's Mathlib pin stays authoritative.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

# The Rust bridges and the hax examples.
[[lean_lib]]
name = "InteropRust"
roots = [
  "Interop.Aeneas.ITree", "Interop.Aeneas.WP", "Interop.Rust.Common", "Interop.Rust.Run",
  "Interop.Rust.RustM", "Interop.Rust.Triple", "Interop.Hax.Holds",
  "Interop.Hax.Adc.Verification", "Interop.Hax.Barrett.Verification",
  "Interop.Hax.CenteredBinomial.Verification", "Interop.Hax.Computation.Verification",
  "Interop.Hax.Division.Verification", "Interop.Hax.Examples.Verification",
]

# The modules hax extracts from the example crates in `Interop/Hax/<Name>/`, generated by
# `scripts/regenerate-hax.sh` and committed. aeneas writes no module docstring, so the header linter
# is off for them; the proofs about them are in `InteropRust`.
[[lean_lib]]
name = "InteropHaxExtraction"
globs = [
  "Interop.Hax.Adc.Extraction.+", "Interop.Hax.Barrett.Extraction.+",
  "Interop.Hax.CenteredBinomial.Extraction.+", "Interop.Hax.Computation.Extraction.+",
  "Interop.Hax.Division.Extraction.+", "Interop.Hax.Examples.Extraction.+",
]
leanOptions = { weak.linter.style.header = false }
