name = "VCVioInteropSquirrel"
defaultTargets = ["InteropSquirrel"]
testDriver = "InteropSquirrelTest"

# The Squirrel sub-project of `Interop/`: the logic of the Squirrel prover, embedded deeply on
# PolyFun's scoped syntax, with its semantics and the soundness of its rules. It requires only
# VCVio. Sources are read from the repository root, so modules keep their `Interop.Squirrel.`
# names, and the dependency cache is the root's. See README.md.
srcDir = "../.."
packagesDir = "../../.lake/packages"

# The root package's options, so the development meets the same style.
[leanOptions]
pp.unicode.fun = true
pp.proofs.withType = false
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.redundantVisibility = true
weak.linter.style.longFile = 1500
experimental.vcgen = true
weak.linter.unicodeLinter = false
weak.linter.constructorNameAsVariable = false

[[require]]
name = "VCVio"
path = "../.."

# The syntax, the models and machines, global formulas and the derivations of the structural
# rules. As the default target, its roots are the roots of the sub-project's axiom sweep in CI.
[[lean_lib]]
name = "InteropSquirrel"
roots = [
  "Interop.Squirrel.Syntax", "Interop.Squirrel.Model", "Interop.Squirrel.RandomVariable",
  "Interop.Squirrel.Machine", "Interop.Squirrel.Indist", "Interop.Squirrel.Global",
  "Interop.Squirrel.Rules.Local", "Interop.Squirrel.Derivation",
]

# Satisfiability checks, countermodels, bound checks and worked derivations; `lake test` builds
# them.
[[lean_lib]]
name = "InteropSquirrelTest"
roots = [
  "Interop.Squirrel.Test.Validity", "Interop.Squirrel.Test.Bounds",
  "Interop.Squirrel.Test.Structural",
]
