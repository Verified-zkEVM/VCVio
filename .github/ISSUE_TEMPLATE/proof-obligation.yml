name: Proof obligation
description: Track an assumption a theorem depends on until it is discharged.
title: "Proof obligation for `<declaration>` in `<file>`"
labels: ["proof wanted"]
body:
  - type: input
    id: declaration
    attributes:
      label: Declaration
      description: >-
        Name and location, for example `ind_cca_security` in `LatticeCrypto/MLKEM/Security.lean:163`.
    validations:
      required: true
  - type: textarea
    id: statement
    attributes:
      label: Statement and current proof
      description: >-
        The declaration with its docstring and the hypothesis it relies on.
      render: lean
    validations:
      required: true
  - type: textarea
    id: consumers
    attributes:
      label: What depends on it
      description: >-
        Theorems that hold only under this assumption while it stays open, and the PR that
        introduced it.
  - type: textarea
    id: plan
    attributes:
      label: Proof sketch or blockers
      description: >-
        The intended argument or the paper result it follows, missing Mathlib or ToMathlib lemmas,
        or a design decision that has to come first.
