name: Lean Action CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  # Nightly clean build of `main`: the absolute build-time trend, and a check that nothing passes
  # only because of the build cache.
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:
    inputs:
      clean_build:
        description: "Ignore the build cache and build from scratch"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Runs on `main` save the build cache that later runs start from, so a newer push waits for the
  # running one instead of cancelling it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check_imported:
    name: Check Library File Imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Lean environment
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Check PolyFun public boundary
        run: |
          bash scripts/test-polyfun-boundary.sh
          bash scripts/check-polyfun-boundary.sh

      - name: Check broad-expose boundary
        run: |
          bash scripts/test-expose-boundary.sh
          bash scripts/check-expose-boundary.sh

      - name: Report broad-expose boundary trend
        if: github.event_name == 'pull_request'
        run: bash scripts/check-expose-boundary.sh --report "origin/${{ github.base_ref }}"

      - name: Check optional complexity backend isolation
        run: |
          bash scripts/test-complexity-backend-isolation.sh
          bash scripts/check-complexity-backend-isolation.sh

      # A declaration written after the `-/` of the comment that documents it parses,
      # builds and runs, and is invisible to a reader scanning the left margin. Neither
      # pass that might be expected to catch it does, and they are distinct passes.
      # `lake lint -- --style-only` runs Mathlib's four text-based linters, none of which
      # has any notion of a comment. `linter.style.whitespace` is not in that pass at all:
      # it is a syntax linter that runs during elaboration under the package's
      # `weak.linter.mathlibStandardSet`, and its warnings fail the build job through
      # check-warning-log.py. It reports the `/-` and `/-!` forms in the seven proof and
      # three test libraries, but never the `/--` form, whose command starts at the `/--`
      # at column 0. This check is text only, so it belongs in this job rather than behind
      # a build, and for lakefile.lean, VCVioComplexity/lakefile.lean, Interop/ and
      # scripts/ it is the only check of any kind that reads them for this: Lake
      # elaborates the two lakefiles from `import Lake` with no Mathlib linter registered,
      # nothing builds Interop/, and scripts/ is built here but imports no Mathlib, so the
      # `weak.` option is dropped. Over VCVioComplexity/ the linter does run and warn --
      # its own lakefile enables it explicitly and the complexity_backend job builds it --
      # but no step turns that warning into a failure.
      - name: Check comment fences
        run: |
          bash scripts/test-comment-fences.sh
          python3 scripts/check-comment-fences.py

      # Regenerates every umbrella with scripts/update-lib.sh and fails if any of them changes.
      - name: Check generated umbrella modules
        run: |
          python3 scripts/test-check-imports.py
          python3 scripts/test-validation.py
          bash scripts/check-imports.sh

  complexity_backend:
    name: Optional Complexity Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Lean environment
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Materialize the pinned PolyFun checkout
        run: lake update PolyFun

      - name: Fetch Mathlib cache for the optional package
        working-directory: VCVioComplexity
        run: |
          lake update
          lake exe cache get

      - name: Run exact-machine canaries, trust checks, and compatibility preflight
        working-directory: VCVioComplexity
        run: ./scripts/test.sh

  downstream_stub_link:
    name: Downstream Consumer Build (no submodules)
    runs-on: ubuntu-latest
    env:
      CLEAN_BUILD: ${{ github.event_name == 'schedule' || inputs.clean_build == true }}
    steps:
      # No `submodules:` input on purpose: this job reproduces issue #495. A
      # downstream `require VCVio` never has the third_party/ submodules
      # checked out, yet Lake links every dependency `extern_lib` into any
      # consumer `lean_exe`, so the native targets must degrade gracefully.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same caches as `Build Project`, with the same paths and keys. A path dependency builds
      # into its own `.lake/build`, so the restored VCVio build serves the consumer as it is. The
      # dependencies belong to the consumer's workspace, so the restored `.lake/packages` is moved
      # there before `lake update`. The native stubs this job exists to exercise are still built:
      # a stub archive's trace differs from the real archive's, so Lake rebuilds it.
      - name: Restore dependency cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake/packages
            !.lake/packages/**/*.setup.json
          key: lake-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lake-deps-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore build cache
        if: env.CLEAN_BUILD != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake/build
            !.lake/build/**/*.setup.json
          key: vcvio-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            vcvio-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            vcvio-build-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up Lean environment
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          # The scratch consumer has its own package directory, hydrated below.
          use-mathlib-cache: false
      - name: Build a scratch consumer requiring VCVio by path
        env:
          # Defer cache hydration until the scratch consumer's manifest exists.
          MATHLIB_NO_CACHE_ON_UPDATE: "1"
        run: |
          consumer="$RUNNER_TEMP/vcvio-consumer"
          mkdir -p "$consumer/.lake"
          if [ -d .lake/packages ]; then
            mv .lake/packages "$consumer/.lake/packages"
          fi
          cp lean-toolchain "$consumer/"
          cp HashSigTest/ModuleAPI/SchemeGames.lean "$consumer/SchemeAPI.lean"
          cp VCVioTest/ModuleAPI/Counting.lean "$consumer/CountingAPI.lean"
          cp VCVioTest/ModuleAPI/Cache.lean "$consumer/CacheAPI.lean"
          cp HashSigTest/ModuleAPI/FinalValidity.lean "$consumer/FinalValidityAPI.lean"
          {
            echo 'name = "consumer"'
            echo 'defaultTargets = ["consumer"]'
            echo ''
            echo '[[require]]'
            echo 'name = "VCVio"'
            echo "path = \"$GITHUB_WORKSPACE\""
            echo ''
            echo '[[lean_lib]]'
            echo 'name = "SchemeAPI"'
            echo ''
            echo '[[lean_lib]]'
            echo 'name = "CountingAPI"'
            echo ''
            echo '[[lean_lib]]'
            echo 'name = "CacheAPI"'
            echo ''
            echo '[[lean_lib]]'
            echo 'name = "FinalValidityAPI"'
            echo ''
            echo '[[lean_exe]]'
            echo 'name = "consumer"'
            echo 'root = "Main"'
          } > "$consumer/lakefile.toml"
          {
            echo 'module'
            echo ''
            echo '-- `public import`: the universe example below is a `public` declaration, so'
            echo '-- the names in its type must be publicly imported, not just privately visible.'
            echo 'public import VCVio'
            echo 'public import VCVio.EvalDist.PFunctor'
            echo 'public import SchemeAPI'
            echo 'public import CountingAPI'
            echo 'public import CacheAPI'
            echo 'public import FinalValidityAPI'
            echo ''
            echo '#check OracleComp'
            echo '#check PFunctor.IsProbabilitySpec'
            echo '#check PFunctor.Handler.preInsert'
            echo ''
            echo '-- A downstream consumer whose oracle responses do not live in `Type 0`.'
            echo '-- The public simulation-composition laws must apply at that generality:'
            echo '-- a law that only holds at `Type 0` is not a reusable replacement for a'
            echo '-- downstream adapter, which is exactly how ArkLib ended up carrying local'
            echo '-- copies of six of them.'
            echo 'universe uQuery uTarget'
            echo ''
            echo 'public example {i1 : Type} {i2 : Type}'
            echo '    {s1 : OracleSpec.{0, uQuery} i1} {s2 : OracleSpec.{0, uQuery} i2}'
            echo '    {t : Type uQuery -> Type uTarget} [Monad t] [LawfulMonad t]'
            echo '    (f1 : QueryImpl s1 t) (f2 : QueryImpl s2 t)'
            echo '    {A : Type uQuery} (x : OracleComp s1 A) :'
            echo '    simulateQ (f1 + f2) (liftM x : OracleComp (s1 + s2) A) ='
            echo '      simulateQ f1 x :='
            echo '  QueryImpl.simulateQ_add_liftM_left f1 f2 x'
            echo ''
            echo 'public def main : IO Unit := IO.println "consumer ok"'
          } > "$consumer/Main.lean"
          python3 scripts/add-api-consumer-fixtures.py "$consumer"
          cd "$consumer"
          lake update
          lake exe cache get
          lake build
          ./.lake/build/bin/consumer

  build:
    name: Build Project
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    env:
      CLEAN_BUILD: ${{ github.event_name == 'schedule' || inputs.clean_build == true }}
    steps:
      # Shallow: nothing in this job reads history, and with `fetch-depth: 0` actions/checkout
      # also clones the full history of every `third_party/` submodule (~2.5 min).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      # PR-controlled values (the branch name) reach the script through `env`, never through
      # `${{ }}` interpolation into the script text.
      - name: Initialize timing paths
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "BUILD_TIMING_RESULTS=$RUNNER_TEMP/build-timing.jsonl" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_LOG_DIR=$RUNNER_TEMP/build-timing-logs" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_ARTIFACT_DIR=$RUNNER_TEMP/build-timing-artifact" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_ARTIFACT_NAME=build-timing-data" >> "$GITHUB_ENV"
          echo "MODULE_TIMES_BASE=$RUNNER_TEMP/module-times-base.json" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_REPORT=$RUNNER_TEMP/build-timing.md" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_COMMENT=$RUNNER_TEMP/build-timing-comment.md" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_SOURCE_BRANCH=$SOURCE_BRANCH" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_BUILD_COMMAND=lake build ToMathlib VCVio VCVioCslib LatticeCrypto Extern HashSig Examples VCVioWidgets" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_TEST_NAME=Smoke test" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_TEST_COMMAND=lake env lean VCVioTest/Smoke.lean" >> "$GITHUB_ENV"
          {
            echo "BUILD_TIMING_SOURCE_SUBJECT<<EOF"
            git log -1 --format=%s
            echo "EOF"
          } >> "$GITHUB_ENV"
      # Two caches with different lifetimes. Dependencies change only with the manifest; the VCVio
      # build changes with every commit, so it is saved per `main` run and restored from the newest
      # one. Lake decides what to rebuild from content hashes of each module's source and imports,
      # so a restored build is only a starting point: whatever this checkout changed, and
      # everything importing it, is rebuilt. Lake regenerates the `*.setup.json` files per build
      # and never reads old ones.
      - name: Restore dependency cache
        id: deps-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake/packages
            !.lake/packages/**/*.setup.json
          key: lake-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          # On a dependency bump, start from the previous packages; Lake checks out the new
          # revisions and rebuilds only the packages that changed.
          restore-keys: |
            lake-deps-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore build cache
        if: env.CLEAN_BUILD != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake/build
            !.lake/build/**/*.setup.json
          key: vcvio-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            vcvio-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            vcvio-build-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up Lean environment
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Fetch Mathlib cache
        run: lake exe cache get
      # The module times recorded with the restored build are this run's per-module baseline.
      - name: Keep cached module times as the baseline
        run: |
          if [ -f .lake/build/vcvio-module-times.json ]; then
            cp .lake/build/vcvio-module-times.json "$MODULE_TIMES_BASE"
          fi
      - name: Time library build
        run: |
          bash scripts/build_timing_report.sh run library_build "$BUILD_TIMING_RESULTS" -- \
            bash -eo pipefail -c "$BUILD_TIMING_BUILD_COMMAND"
      # Lake stores each module's messages in its trace and replays them for modules it does not
      # rebuild, so the log carries every warning whether or not the module came from the cache.
      - name: Check warning budget
        run: |
          python3 ./scripts/check-warning-log.py "$BUILD_TIMING_LOG_DIR/library_build.log" \
            --path-prefix ToMathlib/ \
            --path-prefix VCVio/ \
            --path-prefix VCVioCslib/ \
            --path-prefix Extern/ \
            --path-prefix LatticeCrypto/ \
            --path-prefix HashSig/ \
            --path-prefix Examples/ \
            --path-prefix VCVioWidgets/ \
            --path-prefix ToMathlib.lean \
            --path-prefix VCVio.lean \
            --path-prefix VCVioCslib.lean \
            --path-prefix Extern.lean \
            --path-prefix LatticeCrypto.lean \
            --path-prefix HashSig.lean \
            --path-prefix Examples.lean \
            --path-prefix VCVioWidgets.lean \
            --exclude-substring 'declaration uses `sorry`' \
            --exclude-substring 'VCVio retiring probability API' \
            --label 'repository non-sorry warnings'
      - name: Time test module
        run: |
          bash scripts/build_timing_report.sh run test_path "$BUILD_TIMING_RESULTS" -- \
            bash -eo pipefail -c 'lake env lean VCVioTest/Smoke.lean'
      # Enforcing from day one: new taint (exit 1: `sorryAx` or non-standard axioms not in
      # the committed baseline) fails the build, as do infrastructure failures (exit 2:
      # missing or unparsable baseline, tool breakage) — a broken tool must never read as
      # a clean verdict.
      # Sweeps the non-test libraries; Interop (the declared TCB) is bounded by
      # its import-isolation gate instead.
      # Exercise the sweep against its own fixtures before trusting its verdict on the
      # library: the fixtures carry synthetic taint of each shape the tool reasons about
      # (direct and transitive `sorryAx`, an axiom occurring only in a type, a mutual
      # family whose taint crosses the cycle, generated `._native.` name shapes), plus
      # the exit-code matrix CI depends on.
      - name: Test the axiom sweep tool
        run: ./scripts/test-axiomsweep.sh
      - name: Axiom sweep
        run: lake exe axiomsweep --check
      # The eager-initialisation ratchet. A top-level constant of non-function type is
      # evaluated when its module is loaded, before any `main` runs, so a finiteness
      # instance written the obvious way builds an enumeration of its carrier at start-up
      # in every executable that imports the module. That elaborates cleanly, builds
      # cleanly, and passes every other gate here; it fails only when the binary runs.
      # Needs the oleans the build above produced, as the axiom sweep does. The fixtures
      # go first for the same reason: seven fixture modules, one per route by which loading
      # a module can build such an enumeration — including the respelling that a name test
      # accepts and the specialisations that have no environment constant to read — one
      # negative control per clause of the predicate, and the baseline's own accept / drop /
      # narrow / widen / re-scope / preserve behaviour, so the committed baseline is
      # falsifiable rather than merely true.
      - name: Test the init sweep tool
        run: ./scripts/test-initsweep.sh
      - name: Init sweep
        run: lake exe initsweep --check
      # `lake test` runs the `test` script from `lakefile.lean`: it builds the three test
      # libraries (every module reachable from `VCVioTest.lean`, the Lean-only lattice helpers
      # and vectors, the SLH-DSA canaries) and runs the smoke test and the SLH-DSA test
      # executables. The native ML-KEM / ML-DSA / Falcon executables are behind `-- --ffi` and
      # stay on the nightly FFI workflow. Kept out of the timed build commands on purpose: the
      # library-build row times exactly the non-test libraries.
      - name: Test
        shell: bash  # explicit bash gives pipefail; the default `bash -e {0}` does not
        run: lake test 2>&1 | tee "$BUILD_TIMING_LOG_DIR/test_build.log"
      # The test libraries are the tactic gate: a warning there (an unused tactic, a
      # redundant `grind` parameter, a deprecated name) is a gate entry going stale, so
      # it fails the job like a proof-library warning does. Dependency logs are replayed
      # into this output too, hence the test-library path prefixes: the `sorry` warnings
      # under the proof libraries are the proof-library gate's business.
      - name: Check test-library warning budget
        run: |
          python3 ./scripts/check-warning-log.py "$BUILD_TIMING_LOG_DIR/test_build.log" \
            --path-prefix VCVioTest/ \
            --path-prefix VCVioTest.lean \
            --path-prefix LatticeCryptoTest/ \
            --path-prefix LatticeCryptoTest.lean \
            --path-prefix HashSigTest/ \
            --exclude-substring 'VCVio retiring probability API' \
            --label 'test-library warnings'
      # The same ratchet over the test libraries, which only exist as oleans once `lake
      # test` has built them — the incident this gate exists for would have been just as
      # expensive written in a test library. `VCVioTest` and `LatticeCryptoTest` have
      # umbrella modules and are swept; `HashSigTest` is a `submodules` glob with no
      # umbrella and thirteen roots that each define `main`, so it is not, and
      # `scripts/InitSweep.lean` records precisely what that leaves uncovered.
      - name: Init sweep (test libraries)
        run: lake exe initsweep --check --root VCVioTest --root LatticeCryptoTest
      - name: Record module times
        run: |
          python3 scripts/module_times.py update .lake/build/vcvio-module-times.json \
            --commit "$GITHUB_SHA" \
            "$BUILD_TIMING_LOG_DIR/library_build.log" "$BUILD_TIMING_LOG_DIR/test_build.log"
      # Only `main` writes caches. Pull request and merge-queue runs restore them and discard their
      # own build, so untrusted code never publishes an artifact another run loads, and their builds
      # do not evict the `main` caches from the repository's 10 GB budget.
      - name: Save dependency cache
        if: github.ref == 'refs/heads/main' && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake/packages
            !.lake/packages/**/*.setup.json
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}
      # Keyed by run as well as commit, so a nightly clean build of an already-cached commit still
      # lands; restores take the newest match.
      - name: Save build cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake/build
            !.lake/build/**/*.setup.json
          key: vcvio-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}-${{ github.run_id }}
      - name: Prepare timing artifact
        if: always()
        run: |
          rm -rf "$BUILD_TIMING_ARTIFACT_DIR"
          mkdir -p "$BUILD_TIMING_ARTIFACT_DIR"
          if [ -f "$BUILD_TIMING_RESULTS" ]; then
            cp "$BUILD_TIMING_RESULTS" "$BUILD_TIMING_ARTIFACT_DIR/results.jsonl"
          fi
          for log in library_build test_build; do
            if [ -f "$BUILD_TIMING_LOG_DIR/$log.log" ]; then
              cp "$BUILD_TIMING_LOG_DIR/$log.log" "$BUILD_TIMING_ARTIFACT_DIR/$log.log"
            fi
          done
          if [ -f "$MODULE_TIMES_BASE" ]; then
            cp "$MODULE_TIMES_BASE" "$BUILD_TIMING_ARTIFACT_DIR/module-times-base.json"
          fi
          if [ -f .lake/build/vcvio-module-times.json ]; then
            cp .lake/build/vcvio-module-times.json "$BUILD_TIMING_ARTIFACT_DIR/module-times.json"
          fi
      - name: Upload timing artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BUILD_TIMING_ARTIFACT_NAME }}
          path: ${{ env.BUILD_TIMING_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30
      # The per-module baseline is the module table restored with the build cache, so no other
      # run's artifact is needed.
      - name: Render build timing report
        if: always()
        run: |
          BUILD_TIMING_LOG_DIR="$BUILD_TIMING_ARTIFACT_DIR" bash scripts/build_timing_report.sh \
            render "$BUILD_TIMING_ARTIFACT_DIR/results.jsonl" > "$BUILD_TIMING_REPORT"
          cat "$BUILD_TIMING_REPORT" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '<!-- vcvio-build-timing-report -->'
            echo
            cat "$BUILD_TIMING_REPORT"
          } > "$BUILD_TIMING_COMMENT"
      - name: Upsert build timing PR comment
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- vcvio-build-timing-report -->';
            const body = fs.readFileSync(process.env.BUILD_TIMING_COMMENT, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  # Batteries' environment linters over the proof libraries (the lint driver in `lakefile.lean`)
  # import one whole environment per library; run inside `Build Project` they pushed the hosted
  # runner into a shutdown, so they get their own runner. The job restores the same caches as
  # `Build Project` and builds the changed modules itself, so it runs alongside that job instead
  # of waiting for it.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      # Full history for the baseline's merge base, but the submodules only at their pinned
      # commits: actions/checkout would clone their full history too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check out submodules
        run: git submodule update --init --recursive --depth 1
      # Paths and keys must match the saves in `Build Project` exactly, or the restore misses.
      - name: Restore dependency cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake/packages
            !.lake/packages/**/*.setup.json
          key: lake-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lake-deps-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake/build
            !.lake/build/**/*.setup.json
          key: vcvio-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            vcvio-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            vcvio-build-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up Lean environment
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Test lint orchestration
        run: python3 scripts/test-lint.py
      # Without `--no-build` the driver runs `lake build` on the proof libraries first.
      - name: Build and lint each library, and check exact baseline
        env:
          LINT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: |
          args=(--env-only)
          if [[ -n "$LINT_BASE_REF" ]]; then
            args+=(--base-ref "$LINT_BASE_REF")
          fi
          lake lint -- "${args[@]}"
