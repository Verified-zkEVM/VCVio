name: Lean Action CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_imported:
    name: Check Library File Imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Lean environment
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Check for all imports in ToMathlib
        run: lake exe mk_all --lib ToMathlib --check

      - name: Check for all imports in VCVio
        run: lake exe mk_all --lib VCVio --check

      - name: Check for all imports in LatticeCrypto
        run: lake exe mk_all --lib LatticeCrypto --check

      - name: Check for all imports in Extern
        run: lake exe mk_all --lib Extern --check

      - name: Check for all imports in HashSig
        run: lake exe mk_all --lib HashSig --check

      - name: Check for all imports in Examples
        run: lake exe mk_all --lib Examples --check

      - name: Check for all imports in VCVioWidgets
        run: lake exe mk_all --lib VCVioWidgets --check

  downstream_stub_link:
    name: Downstream Consumer Build (no submodules)
    runs-on: ubuntu-latest
    steps:
      # No `submodules:` input on purpose: this job reproduces issue #495. A
      # downstream `require VCVio` never has the third_party/ submodules
      # checked out, yet Lake links every dependency `extern_lib` into any
      # consumer `lean_exe`, so the native targets must degrade gracefully.
      - uses: actions/checkout@v4
      - name: Set up Lean environment
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Build a scratch consumer requiring VCVio by path
        env:
          # The consumer's Main imports nothing, so Mathlib's olean cache is
          # dead weight; skip its post-update `lake exe cache get` hook.
          MATHLIB_NO_CACHE_ON_UPDATE: "1"
        run: |
          consumer="$RUNNER_TEMP/vcvio-consumer"
          mkdir -p "$consumer"
          cp lean-toolchain "$consumer/"
          {
            echo 'name = "consumer"'
            echo 'defaultTargets = ["consumer"]'
            echo ''
            echo '[[require]]'
            echo 'name = "VCVio"'
            echo "path = \"$GITHUB_WORKSPACE\""
            echo ''
            echo '[[lean_exe]]'
            echo 'name = "consumer"'
            echo 'root = "Main"'
          } > "$consumer/lakefile.toml"
          printf 'def main : IO Unit := IO.println "consumer ok"\n' > "$consumer/Main.lean"
          cd "$consumer"
          lake update
          lake build
          ./.lake/build/bin/consumer

  build:
    name: Build Project
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Initialize timing paths
        run: |
          echo "BUILD_TIMING_RESULTS=$RUNNER_TEMP/build-timing.jsonl" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_LOG_DIR=$RUNNER_TEMP/build-timing-logs" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_ARTIFACT_DIR=$RUNNER_TEMP/build-timing-artifact" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_ARTIFACT_NAME=build-timing-data" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_BASELINE_DIR=$RUNNER_TEMP/build-timing-baseline" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_REPORT=$RUNNER_TEMP/build-timing.md" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_COMMENT=$RUNNER_TEMP/build-timing-comment.md" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_SOURCE_BRANCH=${{ github.head_ref || github.ref_name }}" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_BASE_REF=" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_CLEAN_COMMAND=rm -rf .lake/build && lake build ToMathlib VCVio LatticeCrypto Extern HashSig Examples VCVioWidgets" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_WARM_COMMAND=lake build ToMathlib VCVio LatticeCrypto Extern HashSig Examples VCVioWidgets" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_TEST_NAME=Smoke test" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_TEST_COMMAND=lake env lean VCVioTest/Smoke.lean" >> "$GITHUB_ENV"
          {
            echo "BUILD_TIMING_SOURCE_SUBJECT<<EOF"
            git log -1 --format=%s
            echo "EOF"
          } >> "$GITHUB_ENV"
      - name: Determine PR timing base ref
        if: github.event_name == 'pull_request'
        run: |
          echo "BUILD_TIMING_BASE_REF=${{ github.event.pull_request.base.ref }}" >> "$GITHUB_ENV"
      - name: Restore Lake cache
        id: lake-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
      - name: Set up Lean environment
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Time clean build
        run: |
          bash scripts/build_timing_report.sh run clean_build "$BUILD_TIMING_RESULTS" -- \
            bash -eo pipefail -c "$BUILD_TIMING_CLEAN_COMMAND"
      - name: Check warning budget
        run: |
          python3 ./scripts/check-warning-log.py "$BUILD_TIMING_LOG_DIR/clean_build.log" \
            --path-prefix ToMathlib/ \
            --path-prefix VCVio/ \
            --path-prefix Extern/ \
            --path-prefix LatticeCrypto/ \
            --path-prefix HashSig/ \
            --path-prefix Examples/ \
            --path-prefix VCVioWidgets/ \
            --path-prefix ToMathlib.lean \
            --path-prefix VCVio.lean \
            --path-prefix Extern.lean \
            --path-prefix LatticeCrypto.lean \
            --path-prefix HashSig.lean \
            --path-prefix Examples.lean \
            --path-prefix VCVioWidgets.lean \
            --exclude-substring 'declaration uses `sorry`' \
            --label 'repository non-sorry warnings'
      - name: Time warm rebuild
        run: |
          bash scripts/build_timing_report.sh run warm_rebuild "$BUILD_TIMING_RESULTS" -- \
            bash -eo pipefail -c "$BUILD_TIMING_WARM_COMMAND"
      - name: Time test module
        run: |
          bash scripts/build_timing_report.sh run test_path "$BUILD_TIMING_RESULTS" -- \
            bash -eo pipefail -c 'lake env lean VCVioTest/Smoke.lean'
      - name: Check round-by-round extraction regression
        run: lake env lean VCVioTest/RoundByRound/OneRound.lean
      - name: Check Merkle batch-opening canaries
        run: lake env lean VCVioTest/MerkleTreeBatch.lean
      - name: Run SLH-DSA-SHA2-128-24 differential KAT
        run: lake exe slhdsa_kat
      - name: Run SLH-DSA-C13 differential KAT
        run: lake exe slhdsa_c13_kat
      # - name: Run ML-KEM tests
      #   run: |
      #     .lake/build/bin/mlkem_test
      - name: Save Lake cache
        if: success() && steps.lake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
      - name: Prepare timing artifact
        if: always()
        run: |
          rm -rf "$BUILD_TIMING_ARTIFACT_DIR"
          mkdir -p "$BUILD_TIMING_ARTIFACT_DIR"
          if [ -f "$BUILD_TIMING_RESULTS" ]; then
            cp "$BUILD_TIMING_RESULTS" "$BUILD_TIMING_ARTIFACT_DIR/results.jsonl"
          fi
          if [ -f "$BUILD_TIMING_LOG_DIR/clean_build.log" ]; then
            cp "$BUILD_TIMING_LOG_DIR/clean_build.log" "$BUILD_TIMING_ARTIFACT_DIR/clean_build.log"
          fi
      - name: Upload timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_TIMING_ARTIFACT_NAME }}
          path: ${{ env.BUILD_TIMING_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30
      - name: Determine comparison baseline artifact
        if: always() && github.event_name == 'pull_request'
        id: timing-baseline
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifactName = process.env.BUILD_TIMING_ARTIFACT_NAME;
            const workflowName = process.env.GITHUB_WORKFLOW;
            const currentRunId = Number(process.env.GITHUB_RUN_ID);
            const currentSha = process.env.GITHUB_SHA;
            const pullRequest = context.payload.pull_request;
            const headRef = pullRequest.head.ref;
            const baseRef = process.env.BUILD_TIMING_BASE_REF;

            async function firstRunWithArtifact(runs) {
              for (const run of runs) {
                if (run.id === currentRunId) {
                  continue;
                }
                if (run.name !== workflowName || run.conclusion !== 'success') {
                  continue;
                }
                const artifactsResponse = await github.rest.actions.listWorkflowRunArtifacts({
                  owner,
                  repo,
                  run_id: run.id,
                  per_page: 100,
                });
                const artifact = artifactsResponse.data.artifacts.find(candidate =>
                  candidate.name === artifactName && !candidate.expired
                );
                if (artifact) {
                  return run;
                }
              }
              return null;
            }

            const baseRunsResponse = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              event: 'push',
              branch: baseRef,
              status: 'completed',
              per_page: 100,
            });
            const baseCandidates = baseRunsResponse.data.workflow_runs.filter(run =>
              run.name === workflowName && run.conclusion === 'success'
            );
            const baseRun = await firstRunWithArtifact(baseCandidates);
            if (baseRun) {
              core.setOutput('run-id', String(baseRun.id));
              core.setOutput('sha', baseRun.head_sha);
              core.setOutput(
                'label',
                `the latest successful \`${baseRef}\` run`
              );
              return;
            }

            const prRunsResponse = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              event: 'pull_request',
              branch: headRef,
              status: 'completed',
              per_page: 100,
            });
            const previousPrCandidates = prRunsResponse.data.workflow_runs.filter(run => {
              if (run.head_sha === currentSha) {
                return false;
              }
              const prs = run.pull_requests || [];
              return prs.length === 0 || prs.some(pr => pr.number === pullRequest.number);
            });
            const previousPrRun = await firstRunWithArtifact(previousPrCandidates);
            if (previousPrRun) {
              core.setOutput('run-id', String(previousPrRun.id));
              core.setOutput('sha', previousPrRun.head_sha);
              core.setOutput('label', 'the previous successful PR update');
              return;
            }

            core.info('No comparison baseline artifact found.');
            core.setOutput('run-id', '');
            core.setOutput('sha', '');
            core.setOutput('label', '');
      - name: Download comparison baseline artifact
        if: always() && steps.timing-baseline.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_TIMING_ARTIFACT_NAME }}
          path: ${{ env.BUILD_TIMING_BASELINE_DIR }}
          run-id: ${{ steps.timing-baseline.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Render build timing report
        if: always()
        env:
          BUILD_TIMING_BASELINE_LABEL: ${{ steps.timing-baseline.outputs.label }}
          BUILD_TIMING_BASELINE_SHA: ${{ steps.timing-baseline.outputs.sha }}
        run: |
          if [ -f "$BUILD_TIMING_BASELINE_DIR/results.jsonl" ]; then
            bash scripts/build_timing_report.sh render "$BUILD_TIMING_RESULTS" "$BUILD_TIMING_BASELINE_DIR" > "$BUILD_TIMING_REPORT"
          else
            bash scripts/build_timing_report.sh render "$BUILD_TIMING_RESULTS" > "$BUILD_TIMING_REPORT"
          fi
          cat "$BUILD_TIMING_REPORT" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '<!-- vcvio-build-timing-report -->'
            echo
            cat "$BUILD_TIMING_REPORT"
          } > "$BUILD_TIMING_COMMENT"
      - name: Upsert build timing PR comment
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- vcvio-build-timing-report -->';
            const body = fs.readFileSync(process.env.BUILD_TIMING_COMMENT, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
