name: Agent Docs

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

jobs:
  check_agent_docs:
    name: Check Agent Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Validate doc references
        run: |
          uv run --no-project --python 3.12 python scripts/test-agent-docs.py
          uv run --no-project --python 3.12 python scripts/check-agent-docs.py
      - name: Check auto-generated doc fragments
        run: uv run --no-project --python 3.12 python scripts/extract-doc-fragments.py --check
      - name: Check documentation names for retired declarations
        run: uv run --no-project --python 3.12 python scripts/check-doc-names.py
