name: Agent Docs

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

jobs:
  check_agent_docs:
    name: Check Agent Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate doc references
        run: |
          python scripts/test-agent-docs.py
          python scripts/check-agent-docs.py
      - name: Check auto-generated doc fragments
        run: python scripts/extract-doc-fragments.py --check
      - name: Check documentation names for retired declarations
        run: python scripts/check-doc-names.py
